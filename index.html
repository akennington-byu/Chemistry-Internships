<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recurring Internships, REUs & Challenges Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for reading live Google Sheets CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Alpine.js for reactive filtering and UI -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen" x-data="opportunityApp()" x-init="initData()">

  <!-- Top Navigation Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-indigo-500 text-white text-xs font-bold px-2.5 py-0.5 rounded uppercase tracking-wider">Student Portal</span>
          <span class="text-slate-400 text-xs" x-text="dataSourceLabel"></span>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight mt-1">Recurring Internships, REUs & Challenges</h1>
      </div>

      <div class="flex items-center gap-3">
        <button 
          @click="showSavedOnly = !showSavedOnly"
          :class="showSavedOnly ? 'bg-amber-500 text-slate-950 font-semibold' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'"
          class="px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 border border-slate-700">
          <span>★ My Shortlist</span>
          <span class="bg-slate-950/30 px-2 py-0.5 rounded-full text-xs" x-text="savedIds.length"></span>
        </button>

        <button 
          @click="exportShortlistCSV()"
          x-show="savedIds.length > 0"
          x-cloak
          class="px-3 py-2 rounded-lg text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
          Export CSV
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Search & Filter Control Panel -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        
        <!-- Search Input -->
        <div class="md:col-span-5">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Search Programs</label>
          <input 
            type="text" 
            x-model="searchQuery"
            placeholder="Search NASA, Caltech, data science, stipend..." 
            class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          />
        </div>

        <!-- Category Filter -->
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Type</label>
          <select x-model="selectedCategory" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="All">All Types</option>
            <option value="Research / REU">Research / REU</option>
            <option value="Challenge / Competition">Challenge / Competition</option>
            <option value="Industry / Gov Internship">Industry / Gov</option>
            <option value="Fellowship">Fellowship</option>
          </select>
        </div>

        <!-- Class Standing Filter -->
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Eligible Year</label>
          <select x-model="selectedYear" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="All">All Class Standings</option>
            <option value="Freshman">Freshman</option>
            <option value="Sophomore">Sophomore</option>
            <option value="Junior">Junior</option>
            <option value="Senior">Senior</option>
            <option value="Grad">Graduate Student</option>
          </select>
        </div>

        <!-- Status Filter -->
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Status</label>
          <select x-model="selectedStatus" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="All">All Statuses</option>
            <option value="Open Now">Open Now</option>
            <option value="Opening Soon">Opening Soon</option>
            <option value="Rolling">Rolling</option>
            <option value="Closed - Reopens Fall">Closed (Annual)</option>
          </select>
        </div>
      </div>

      <!-- Active Filter Summary & Reset -->
      <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
        <div>
          Showing <span class="font-bold text-slate-800" x-text="filteredPrograms.length"></span> recurring opportunities
          <span x-show="showSavedOnly" class="text-amber-600 font-semibold">(Filtered to your Shortlist)</span>
        </div>
        <div class="flex items-center gap-4">
          <label class="inline-flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" x-model="intlEligibleOnly" class="rounded text-indigo-600 focus:ring-indigo-500">
            <span>Open to International Students</span>
          </label>
          <button @click="resetFilters()" class="text-indigo-600 hover:text-indigo-800 font-medium">Reset Filters</button>
        </div>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div x-show="isLoading" class="text-center py-12 text-slate-500 text-sm">
      Loading live opportunity database...
    </div>

    <!-- Opportunity Cards Grid -->
    <div x-show="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="item in filteredPrograms" :key="item.id">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
          
          <div class="p-5">
            <!-- Top Row: Category Badge & Bookmark -->
            <div class="flex items-start justify-between gap-2 mb-3">
              <span 
                class="text-xs font-semibold px-2.5 py-1 rounded-md"
                :class="{
                  'bg-blue-50 text-blue-700': item.category === 'Research / REU',
                  'bg-purple-50 text-purple-700': item.category === 'Challenge / Competition',
                  'bg-emerald-50 text-emerald-700': item.category === 'Industry / Gov Internship',
                  'bg-amber-50 text-amber-700': item.category === 'Fellowship'
                }"
                x-text="item.category">
              </span>

              <button 
                @click="toggleSave(item.id)" 
                class="text-lg leading-none p-1 rounded hover:bg-slate-100 transition"
                :title="isSaved(item.id) ? 'Remove from Shortlist' : 'Save to Shortlist'">
                <span x-text="isSaved(item.id) ? '★' : '☆'" :class="isSaved(item.id) ? 'text-amber-500' : 'text-slate-400'"></span>
              </button>
            </div>

            <!-- Title & Host -->
            <h2 class="text-lg font-bold text-slate-900 leading-snug" x-text="item.name"></h2>
            <p class="text-sm font-medium text-indigo-600 mt-0.5" x-text="item.organization"></p>

            <!-- Description -->
            <p class="text-sm text-slate-600 mt-3 line-clamp-3" x-text="item.description"></p>

            <!-- Key Metadata Grid -->
            <div class="mt-4 pt-4 border-t border-slate-100 space-y-2 text-xs">
              <div class="flex justify-between gap-2">
                <span class="text-slate-500 shrink-0">Typical Deadline:</span>
                <span class="font-semibold text-slate-800 text-right" x-text="item.typicalDeadline"></span>
              </div>
              <div class="flex justify-between gap-2">
                <span class="text-slate-500 shrink-0">Compensation:</span>
                <span class="font-semibold text-emerald-700 text-right" x-text="item.funding"></span>
              </div>
              <div class="flex justify-between gap-2">
                <span class="text-slate-500 shrink-0">Eligible Years:</span>
                <span class="font-medium text-slate-700 text-right" x-text="item.eligibleYears.join(', ')"></span>
              </div>
              <div class="flex justify-between gap-2">
                <span class="text-slate-500 shrink-0">Citizenship:</span>
                <span class="font-medium text-slate-700 text-right" x-text="item.citizenship"></span>
              </div>
            </div>
          </div>

          <!-- Card Footer -->
          <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
            <span 
              class="inline-flex items-center gap-1.5 text-xs font-semibold"
              :class="{
                'text-emerald-600': item.status === 'Open Now',
                'text-amber-600': item.status === 'Opening Soon',
                'text-blue-600': item.status === 'Rolling',
                'text-slate-500': item.status.includes('Closed')
              }">
              <span class="w-2 h-2 rounded-full"
                :class="{
                  'bg-emerald-500': item.status === 'Open Now',
                  'bg-amber-500': item.status === 'Opening Soon',
                  'bg-blue-500': item.status === 'Rolling',
                  'bg-slate-400': item.status.includes('Closed')
                }"></span>
              <span x-text="item.status"></span>
            </span>

            <a 
              :href="item.url" 
              target="_blank" 
              rel="noopener noreferrer"
              class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
              View Program →
            </a>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty State -->
    <div x-show="!isLoading && filteredPrograms.length === 0" x-cloak class="text-center py-16 bg-white rounded-xl border border-slate-200 mt-4">
      <p class="text-slate-500 text-base font-medium">No programs match your current filter criteria.</p>
      <button @click="resetFilters()" class="mt-3 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-500">
        Clear All Filters
      </button>
    </div>

  </main>

  <script>
    // =========================================================================
    // CONFIGURATION: Paste your Google Sheet "Publish to Web (CSV)" link below
    // =========================================================================
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqq9FMuVqGE2_ABJWiirM7GRAlJfXzJuNWULMIxdD7rnlp8HZl27ZHv1SEgfs46jdg1q1iC2QVSij5/pub?gid=0&single=true&output=csv'; 

    function opportunityApp() {
      return {
        isLoading: true,
        dataSourceLabel: '2026–2027 Cycle',
        searchQuery: '',
        selectedCategory: 'All',
        selectedYear: 'All',
        selectedStatus: 'All',
        intlEligibleOnly: false,
        showSavedOnly: false,
        savedIds: JSON.parse(localStorage.getItem('savedOpportunities') || '[]'),
        programs: [],

        initData() {
          if (SHEET_CSV_URL && SHEET_CSV_URL.trim() !== '') {
            this.dataSourceLabel = 'Live Synced with Google Sheets';
            Papa.parse(SHEET_CSV_URL, {
              download: true,
              header: true,
              skipEmptyLines: true,
              complete: (results) => {
                this.programs = results.data.map((row, index) => ({
                  id: Number(row.id) || index + 1,
                  name: row.name || 'Untitled Program',
                  organization: row.organization || '',
                  category: row.category || 'Research / REU',
                  description: row.description || '',
                  typicalDeadline: row.typicalDeadline || 'See Website',
                  funding: row.funding || 'Varies',
                  eligibleYears: row.eligibleYears 
                    ? row.eligibleYears.split(',').map(y => y.trim()) 
                    : [],
                  citizenship: row.citizenship || 'See Website',
                  intlEligible: String(row.intlEligible).toUpperCase() === 'TRUE',
                  status: row.status || 'Open Now',
                  url: row.url || '#'
                }));
                this.isLoading = false;
              },
              error: (err) => {
                console.error('Failed to load Google Sheet CSV:', err);
                this.loadFallbackData();
              }
            });
          } else {
            this.loadFallbackData();
          }
        },

        loadFallbackData() {
          this.programs = [
            {
              id: 1,
              name: "Caltech WAVE Fellows Program",
              organization: "California Institute of Technology",
              category: "Research / REU",
              description: "10-week summer undergraduate research program fostering diversity by increasing participation of underrepresented students in science and engineering Ph.D. programs.",
              typicalDeadline: "Early January (Jan 10)",
              funding: "$7,740 stipend + housing/travel",
              eligibleYears: ["Sophomore", "Junior", "Senior"],
              citizenship: "US Citizen / Perm. Resident",
              intlEligible: false,
              status: "Open Now",
              url: "https://sfp.caltech.edu/undergraduate-research/programs/wavefellows"
            },
            {
              id: 2,
              name: "NASA University Student Launch Initiative",
              organization: "NASA",
              category: "Challenge / Competition",
              description: "Year-long competitive design challenge where student teams design, build, test, and fly a high-powered amateur rocket carrying a scientific or engineering payload.",
              typicalDeadline: "Mid-September (Proposals)",
              funding: "Team grants & travel support",
              eligibleYears: ["Freshman", "Sophomore", "Junior", "Senior", "Grad"],
              citizenship: "Open to US Institutions",
              intlEligible: true,
              status: "Closed - Reopens Fall",
              url: "https://www.nasa.gov/learning-resources/nasa-student-launch/"
            },
            {
              id: 3,
              name: "DOE Science Undergraduate Laboratory Internships (SULI)",
              organization: "U.S. Department of Energy",
              category: "Industry / Gov Internship",
              description: "Paid research internships at 17 participating DOE national laboratories across the country during Summer, Fall, or Spring terms.",
              typicalDeadline: "Early January (Summer Term)",
              funding: "$650/week + housing allowance",
              eligibleYears: ["Freshman", "Sophomore", "Junior", "Senior"],
              citizenship: "US Citizen / Perm. Resident",
              intlEligible: false,
              status: "Open Now",
              url: "https://science.osti.gov/wdts/suli"
            },
            {
              id: 4,
              name: "NSF Research Experiences for Undergraduates (REU)",
              organization: "National Science Foundation",
              category: "Research / REU",
              description: "Hundreds of funded summer research sites across universities nationwide in computing, engineering, physics, biology, and data science.",
              typicalDeadline: "Jan 15 – Feb 15 (Varies by site)",
              funding: "$6,000–$7,000 + housing",
              eligibleYears: ["Freshman", "Sophomore", "Junior"],
              citizenship: "US Citizen / Perm. Resident",
              intlEligible: false,
              status: "Opening Soon",
              url: "https://www.nsf.gov/crssprgm/reu/"
            },
            {
              id: 5,
              name: "NASA RASC-AL Design Competition",
              organization: "NASA / National Institute of Aerospace",
              category: "Challenge / Competition",
              description: "University-level engineering design competition developing innovative concepts for human and robotic space exploration architectures.",
              typicalDeadline: "Early March (Proposals)",
              funding: "Travel stipends to Cocoa Beach",
              eligibleYears: ["Junior", "Senior", "Grad"],
              citizenship: "Open (Check team rules)",
              intlEligible: true,
              status: "Open Now",
              url: "https://rascal.nianet.org/"
            },
            {
              id: 6,
              name: "NIH Summer Internship Program (SIP)",
              organization: "National Institutes of Health",
              category: "Research / REU",
              description: "Full-time biomedical research alongside leading scientists at NIH campuses in Bethesda, MD and across the US.",
              typicalDeadline: "Mid-February (Rolling review)",
              funding: "Monthly stipend by education level",
              eligibleYears: ["Freshman", "Sophomore", "Junior", "Senior", "Grad"],
              citizenship: "US Citizen / Perm. Resident",
              intlEligible: false,
              status: "Open Now",
              url: "https://www.training.nih.gov/research-training/pb/sip/"
            },
            {
              id: 13,
              name: "Summer Institute in Biostatistics and Data Science (SIBDS)",
              organization: "NIH / NHLBI",
              category: "Research / REU",
              description: "6-to-7-week training program introducing undergraduates to biostatistics, statistical genetics, and data science methods applied to clinical research.",
              typicalDeadline: "Mid-March (Rolling)",
              funding: "Tuition covered + housing & stipend",
              eligibleYears: ["Sophomore", "Junior", "Senior"],
              citizenship: "US Citizen / Perm. Resident",
              intlEligible: false,
              status: "Opening Soon",
              url: "https://www.nhlbi.nih.gov/grants-and-training/summer-institute-biostatistics"
            },
            {
              id: 16,
              name: "Santa Fe Institute Undergraduate Complexity Research (UCR)",
              organization: "Santa Fe Institute",
              category: "Research / REU",
              description: "10-week residential program exploring complex systems, interdisciplinary modeling, network science, and computational social science.",
              typicalDeadline: "Mid-January (Jan 15)",
              funding: "$6,500 stipend + housing & travel",
              eligibleYears: ["Sophomore", "Junior", "Senior"],
              citizenship: "Open to International Students",
              intlEligible: true,
              status: "Open Now",
              url: "https://www.santafe.edu/engage/learn/programs/undergraduate-complexity-research"
            }
          ];
          this.isLoading = false;
        },

        get filteredPrograms() {
          return this.programs.filter(item => {
            const q = this.searchQuery.toLowerCase();
            const matchesSearch = q === '' || 
              item.name.toLowerCase().includes(q) ||
              item.organization.toLowerCase().includes(q) ||
              item.description.toLowerCase().includes(q);

            const matchesCategory = this.selectedCategory === 'All' || item.category === this.selectedCategory;
            const matchesYear = this.selectedYear === 'All' || item.eligibleYears.includes(this.selectedYear);
            const matchesStatus = this.selectedStatus === 'All' || item.status === this.selectedStatus;
            const matchesIntl = !this.intlEligibleOnly || item.intlEligible;
            const matchesSaved = !this.showSavedOnly || this.savedIds.includes(item.id);

            return matchesSearch && matchesCategory && matchesYear && matchesStatus && matchesIntl && matchesSaved;
          });
        },

        toggleSave(id) {
          if (this.savedIds.includes(id)) {
            this.savedIds = this.savedIds.filter(i => i !== id);
          } else {
            this.savedIds.push(id);
          }
          localStorage.setItem('savedOpportunities', JSON.stringify(this.savedIds));
        },

        isSaved(id) {
          return this.savedIds.includes(id);
        },

        resetFilters() {
          this.searchQuery = '';
          this.selectedCategory = 'All';
          this.selectedYear = 'All';
          this.selectedStatus = 'All';
          this.intlEligibleOnly = false;
          this.showSavedOnly = false;
        },

        exportShortlistCSV() {
          const savedItems = this.programs.filter(p => this.savedIds.includes(p.id));
          const headers = ['Program Name', 'Organization', 'Category', 'Typical Deadline', 'Funding', 'URL'];
          const rows = savedItems.map(p => [
            `"${p.name}"`, `"${p.organization}"`, `"${p.category}"`, `"${p.typicalDeadline}"`, `"${p.funding}"`, `"${p.url}"`
          ]);
          const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('
');
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", "my_internship_shortlist.csv");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      };
    }
  </script>
</body>
</html>
